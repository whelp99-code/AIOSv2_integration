entity: project
version: 1
layers:
  bronze:
    description: Raw project intake payload
    fields:
      - name: id
        type: string
        required: true
      - name: rawPayload
        type: object
        required: true
      - name: ingestedAt
        type: string
        format: datetime
        required: true
  silver:
    description: Normalized project record
    fields:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: status
        type: string
        required: true
  gold:
    description: Business-ready project projection
    fields:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: sourceMailId
        type: string
        required: false
