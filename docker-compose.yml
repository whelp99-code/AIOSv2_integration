services:
  postgres:
    image: postgres:16-alpine
    container_name: aios-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aios_password}
      POSTGRES_DB: ${DB_NAME:-aios_v2}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aios}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aios-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
