version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aios-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aios_password}
      POSTGRES_DB: ${DB_NAME:-aios_v2}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aios}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aios-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aios-api
    ports:
      - "${API_PORT:-3200}:3200"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aios}:${DB_PASSWORD:-aios_password}@postgres:5432/${DB_NAME:-aios_v2}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key}
      WEBHOOK_CLIENT_STATE: ${WEBHOOK_CLIENT_STATE:-aios-webhook}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: aios-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3200
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aios-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-aios}:${DB_PASSWORD:-aios_password}@postgres:5432/${DB_NAME:-aios_v2}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
